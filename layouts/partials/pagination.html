<div class="pagination flex-between">
  {{ if .Paginator.HasPrev }}
    <a href="{{ .Paginator.Prev.URL }}">
      <span>←</span>
      <span>{{ T "prev_page" }}</span>
    </a>
  {{ else }}
    <span style="visibility: hidden;">
      <span>←</span>
      <span>{{ T "prev_page" }}</span>
    </span>
  {{ end }}

  {{ if .Paginator.HasNext }}
    <a href="{{ .Paginator.Next.URL }}">
      <span>{{ T "next_page" }}</span>
      <span>→</span>
    </a>
  {{ end }}
</div>
