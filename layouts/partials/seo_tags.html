<!-- Primary Meta Tags -->
<meta
  name="title"
  content="{{ with .Title -}}
    {{ . }}
  {{- else -}}
    {{ .Site.Title }}
  {{- end }}"
/>
<meta
  name="description"
  content="{{ with .Description -}}
    {{ . }}
  {{- else -}}
    {{ if .IsPage -}}
      {{ .Summary }}
    {{- else -}}
      {{ with .Site.Params.description }}{{ . }}{{ end }}
    {{- end }}
  {{- end }}"
/>
<meta
  name="keywords"
  content="{{ if .IsPage -}}
    {{- with .Params.tags -}}{{ delimit . ", " }}{{- end -}}
  {{- else -}}
    {{- $terms := slice -}}
    {{- range $plural, $termMap := .Site.Taxonomies -}}
      {{- range $term, $val := $termMap -}}
        {{- $terms = $terms | append $term -}}
      {{- end -}}
    {{- end -}}
    {{- delimit $terms ", " -}}
  {{- end -}}"
/>
{{ with .Site.Params.author.name }}
  <meta name="author" content="{{ . }}" />
{{ end }}
